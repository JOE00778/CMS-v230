[project]
name = "shouhin-jouhou-kanri"
version = "0.1.0"
description = "商品信息管理平台 - SmikieJapan 综合商品分析与运营工具集"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.42",
    "extra-streamlit-components>=0.1.71",
    "pandas>=2.2",
    "plotly>=5.20",
    "google-genai>=0.3",
    "requests>=2.31",
    "PyMuPDF>=1.24",
    "rapidocr-onnxruntime>=1.3",
    "zxing-cpp>=2.2",   # 面单条码（ECMS 運単号）· 任意依存 · 元川は rebuild 要
    "pillow>=10",
    # ↓ 線上（requirements.txt・Dockerfile）にあって本機に無かった分（2026-11-16 線上と揃える）
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "python-calamine>=0.2",
    "beautifulsoup4>=4.12",
    "google-generativeai>=0.8",
    "psycopg2-binary>=2.9",   # Dockerfile で追加
    "lark-oapi>=1.4",         # Dockerfile で追加
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["data_warehouse*", "modules*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "watchdog>=6",   # 線上（Linux）は streamlit が自動で入れる・macOS では入らないので明示（2026-11-16 線上と揃える）
]

[tool.uv]
# 解く範囲は Python 3.11 だけ（本機・線上とも 3.11。3.14/win32 まで含めると線上の版本の組では解けない）
environments = ["python_version == '3.11'"]
# 本機の版本 = 元川 cms_streamlit 容器の実際の版本（2026-11-16 の pip freeze 85 件・Boss「和线上的环境版本对齐」）。
# 線上を rebuild（redeploy.bat）したら取り直す：ssh cms-ssh.smikie-cms.cc "docker exec cms_streamlit python -m pip freeze"
constraint-dependencies = [
    "altair==6.3.0",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "attrs==26.1.0",
