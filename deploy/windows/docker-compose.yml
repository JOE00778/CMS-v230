# ============================================================
# 一元管理系统 V2.3 · Windows 笔记本部署（影刀共存版）
# Postgres 16 + Streamlit + Cloudflared
# ============================================================
# 配置依据：Dell Inspiron 5405 / Ryzen 5 4500U (6C6T) / 16GB RAM
# 资源严格受限，保证影刀（YingDao）RPA 不受影响：
#   - Postgres: 1 GB RAM / 0.5 CPU
#   - Streamlit: 2 GB RAM / 1.5 CPU
#   - Cloudflared: 256 MB RAM / 0.25 CPU
#   - pgweb (DB 可视化): 256 MB RAM / 0.25 CPU
#   合计：约 3.8 GB RAM + 2.5 CPU 核（剩余 ~12 GB / 3.5 核给影刀 + Windows）
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: cms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cms}
      POSTGRES_USER: ${POSTGRES_USER:-cms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Tokyo
    volumes:
      # Windows: D:\cms-v230\data\postgres → 容器内
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
      - ./schema.postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - cms_net
      - smikie_shared    # ← 跨 stack 网络：让 N8N stack 的 cms-api 容器能连进来
    ports:
      # NST API daily_pull（host 上 uv 実行）→ PG 書き込み用。loopback のみ・公網非公開
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cms} -d ${POSTGRES_DB:-cms}"]
      interval: 30s
      timeout: 5s
      retries: 5

  streamlit:
    build:
      context: ../..
      dockerfile: deploy/windows/Dockerfile
    container_name: cms_streamlit
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cms}
      # page38 広告状況ボード専用 · cms_reader は marketing 3ビューのみ SELECT 可
      # CMS_READER_PASSWORD は deploy/windows/.env に置く(未設定でも頁側がエラーメッセージで degrade·他頁影響なし)
      MARKETING_DATABASE_URL: postgresql://cms_reader:${CMS_READER_PASSWORD:-}@postgres:5432/cms
      # 存量只读頁(15頁·Boss 2026-07-27 収権指示)用 · 同じ cms_reader(003 で業務 schema SELECT 付与)
      READONLY_DATABASE_URL: postgresql://cms_reader:${CMS_READER_PASSWORD:-}@postgres:5432/cms
      # 認証は単一パスワード（CF Access + ADMIN_PASSWORD）。guest / username / page99 は廃止（2026-05-20）
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      LARK_APP_ID: ${LARK_APP_ID:-}
      LARK_APP_SECRET: ${LARK_APP_SECRET:-}
      LARK_REDIRECT_URI: ${LARK_REDIRECT_URI:-}
      ADMIN_LARK_EMAILS: ${ADMIN_LARK_EMAILS:-}
      # page 22 画像検索 · 楽天 ItemSearch API v2026-04-01 fallback
      # 需 applicationId + accessKey 配对(2012 后注册的新 UUID app 走此路径)
      RAKUTEN_APPLICATION_ID: ${RAKUTEN_APPLICATION_ID:-}
      RAKUTEN_ACCESS_KEY: ${RAKUTEN_ACCESS_KEY:-}
      TZ: Asia/Tokyo
    volumes:
      # 代码 bind mount（2026-05-19）: git pull 后立即生效，不需 --build
      # 详见 README.md「开发流程」+ T-MIG-001
      - ../../cms.py:/app/cms.py:ro
      - ../../pages:/app/pages:ro
      - ../../shared:/app/shared:ro
      - ../../modules:/app/modules:ro
      - ../../data_warehouse:/app/data_warehouse:ro
      - ../../tools:/app/tools:ro
      - ../../.streamlit:/app/.streamlit:ro
      - ../../assets:/app/assets:ro
      - ../../README.md:/app/README.md:ro
      # 数据卷（运行时读写）
      - ${DATA_DIR:-./data}/files:/app/data/files
    networks:
      - cms_net
      - smikie_shared    # ← T-318: 让 streamlit 能 resolve n8n / cms-api 主机名
    expose:
      - "8501"
    ports:
      - "127.0.0.1:8501:8501"   # 本地浏览器访问 http://localhost:8501（仅本机；公网走 cloudflared）
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 1024M

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cms_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - streamlit
    networks:
      - cms_net
      - smikie_shared
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # ------------------------------------------------------------
  # pgweb · DB 可视化（浏览器看所有表 / 跑 SQL / 导出 CSV·JSON）
  #   笔记本本机访问 http://localhost:8081（绑 127.0.0.1，不走公网）
  #   远程查看请用远程桌面登进笔记本再开；不要映射到 0.0.0.0、也别挂到 cloudflared
  # ------------------------------------------------------------
  pgweb:
    image: sosedoff/pgweb:latest
    container_name: cms_pgweb
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # pgweb は DATABASE_URL を読んで自動接続する
      DATABASE_URL: postgresql://${POSTGRES_USER:-cms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cms}?sslmode=disable
      # 任意: pgweb 自体に簡易 Basic 認証をかけたい場合は .env で下 2 つを設定（空なら認証なし）
      PGWEB_AUTH_USER: ${PGWEB_AUTH_USER:-}
      PGWEB_AUTH_PASS: ${PGWEB_AUTH_PASS:-}
      TZ: Asia/Tokyo
    networks:
      - cms_net
    ports:
      - "127.0.0.1:8081:8081"   # 仅本机；公网一律不开
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # ------------------------------------------------------------
  # nst_scheduler · NST 定时取得ディスパッチャ（常駐）
  #   毎分 nst.pull_schedule を見て daily_pull を起動（自動 + 手動 run_now）
  #   コード(database repo)は volume mount → git pull で更新（再 build 不要）
  #   ⚠️ 初回のみ元川デスクトップで: docker compose build nst_scheduler
  #   build context = ../../../database（CMS-v230 と database が C:\Users\smiki\ で兄弟前提）
  # ------------------------------------------------------------
  nst_scheduler:
    build:
      context: ../../../database
      dockerfile: deploy/scheduler.Dockerfile
    container_name: cms_nst_scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../../../database/.env          # NST_* 凭据（OAuth1 TBA）
    environment:
      # database/.env の DATABASE_URL（localhost:5432）を内網に上書き
      DATABASE_URL: postgresql://${POSTGRES_USER:-cms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cms}
      TZ: Asia/Tokyo
    volumes:
      - ../../../database:/app:ro       # nst_api コード（git pull で更新）
      - ${DATA_DIR:-./data}/shopee:/data/shopee  # Shopee token 持久化（refresh_token 轮换保存）
    networks:
      - cms_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # ------------------------------------------------------------
  # jdl_scheduler · JDL 京东物流海外仓在庫拉取ディスパッチャ（常駐）
  #   毎分 jdl.pull_schedule を見て daily_pull を起動（自動 06:30 JST + 手動 run_now）
  #   コード(database repo)は volume mount → git pull で更新（再 build 不要）
  #   イメージは nst_scheduler と同一 (deploy/scheduler.Dockerfile)
  #   ⚠️ 初回のみ: docker compose build jdl_scheduler （= nst_scheduler とイメージ共有）
  # ------------------------------------------------------------
  jdl_scheduler:
    # 复用 nst_scheduler 已 build 好的镜像（同 Dockerfile · 避免 SSH 跑 build 的 wincred 问题）
    image: windows-nst_scheduler
    container_name: cms_jdl_scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../../../database/.env          # JDL_* 凭据
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cms}
      TZ: Asia/Tokyo
    command: ["python", "-m", "data_warehouse.jdl_api.dispatcher"]
    volumes:
      - ../../../database:/app:ro       # jdl_api コード（git pull で更新）
    networks:
      - cms_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # ------------------------------------------------------------
  # coupang_scheduler · Coupang 결산(settlement) 日次拉取ディスパッチャ（常駐）
  #   毎分 coupang.pull_schedule を見て daily_pull を起動（自動 07:00 JST + 手動 run_now）
  #   イメージは nst_scheduler と同一 · コードは volume mount（scp/git pull で更新）
  #   凭据 COUPANG_*（database/.env · WING key は斑马ERP と共用 · 180 日輪換注意）
  # ------------------------------------------------------------
  # shopee_scheduler · Shopee 受注/配送/入金の日次拉取ディスパッチャ（常駐）
  #   毎分 shopee.pull_schedule を見て daily_pull を起動
  #     shopee_daily        04:00 JST … escrow + logistics を 20 店 × 直近 3 日
  #     shopee_payout_daily 05:30 JST … payout を 30 日窓（週次入金 · UPSERT 冪等）
  #   イメージは nst_scheduler と同一 · コードは volume mount（scp/git pull で更新）
  #   ⚠️ refresh_token は轮换制。Mac 等で同じ token を同時に使うと相互に失効する
  shopee_scheduler:
    image: windows-nst_scheduler
    container_name: cms_shopee_scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../../../database/.env          # SHOPEE_* 凭据
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cms}
      TZ: Asia/Tokyo
    command: ["python", "-m", "data_warehouse.shopee_api.dispatcher"]
    volumes:
      - ../../../database:/app:ro       # shopee_api コード（scp で更新）
      - ./data/shopee:/data/shopee      # token store（refresh_token 轮换の永続化）
    networks:
      - cms_net
    deploy:
      resources:
        limits:
          cpus: '0.25'

  coupang_scheduler:
    image: windows-nst_scheduler
    container_name: cms_coupang_scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../../../database/.env          # COUPANG_* 凭据
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cms}
      TZ: Asia/Tokyo
    command: ["python", "-m", "data_warehouse.coupang_api.dispatcher"]
    volumes:
      - ../../../database:/app:ro       # coupang_api コード（scp/git pull で更新）
    networks:
      - cms_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # ------------------------------------------------------------
  # marketing_scheduler · Google Ads/GA4/Shopify 日次集計採集(T-340)
  #   毎分 marketing.pull_schedule を見て daily_ingest --write を起動
  #   （自動 07:30 JST + 手動 run_now + 初回 7 日 backfill）
  #   ⚠️ 専用イメージ(requests+google-auth+psycopg3 が必要 · NST 镜像不可):
  #      初回のみ元川デスクトップで: docker compose build marketing_scheduler
  #   凭据: database/.env の GOOGLE_MARKETING_*/SHOPIFY_MARKETING_*/
  #        MARKETING_INGEST_DATABASE_URL(完成形URL·marketing_ingest 角色)
  #        + C:\Users\smiki\secrets\marketing\ の 4 ファイル(/secrets mount)
  #   DATABASE_URL は明示的に空 → 超級ユーザー接続串は採集器に渡らない
  # ------------------------------------------------------------
  marketing_scheduler:
    build:
      context: ../../../database
      dockerfile: deploy/marketing-scheduler.Dockerfile
    container_name: cms_marketing_scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../../../database/.env          # GOOGLE_MARKETING_* / SHOPIFY_MARKETING_* / MARKETING_INGEST_DATABASE_URL
    environment:
      DATABASE_URL: ""                  # 遮断: env_file 由来の超級ユーザー URL を無効化
      TZ: Asia/Tokyo
    volumes:
      - ../../../database:/app:ro       # marketing_api コード(scp 直送で更新)
      - C:/Users/smiki/secrets/marketing:/secrets:ro
    networks:
      - cms_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # ------------------------------------------------------------
  # compliance_scheduler · 合规官方源月次盯梢 + Shopify 成分周次同步(page39)
  #   毎分 compliance.pull_schedule を見て source_watch / shopify_item_sync を起動
  #   （source_watch=毎月1日 07:00 JST · shopify_sync=毎週月曜 06:45 JST · run_now 手動可)
  #   ⚠️ 専用イメージ(psycopg3 のみ): 初回のみ元川デスクトップで:
  #      docker compose build compliance_scheduler
  #   凭据: database/.env の COMPLIANCE_INGEST_DATABASE_URL(compliance_ingest 角色)
  #        + Shopify は marketing と同じ Dev Dashboard アプリを流用(client_credentials
  #          交換)。新しいトークンの発行・配置は不要——アプリ側に read_products を
  #          付けるだけ。google 系まで晒さないよう shopify の 2 ファイルだけ ro マウント。
  #        (静的トークンを使いたい場合のみ COMPLIANCE_SHOPIFY_TOKEN_FILE も可)
  #   DATABASE_URL は明示的に空 → 超級ユーザー接続串は採集器に渡らない
  # ------------------------------------------------------------
  compliance_scheduler:
    # nst_scheduler の既存イメージを流用(依存は psycopg のみで同一)。専用 Dockerfile を
    # build しないのは、SSH 経由の docker compose build が wincred で失敗するため
    # (jdl_scheduler と同じ回避策)。コードは volume mount なので scp 直送で更新可。
    image: windows-nst_scheduler
    command: ["python", "-m", "data_warehouse.compliance_api.dispatcher"]
    container_name: cms_compliance_scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../../../database/.env          # COMPLIANCE_INGEST_DATABASE_URL / COMPLIANCE_SHOPIFY_*
    environment:
      DATABASE_URL: ""                  # 遮断: env_file 由来の超級ユーザー URL を無効化
      TZ: Asia/Tokyo
      COMPLIANCE_SHOPIFY_CLIENT_ID_FILE: /secrets_app/shopify-client-id
      COMPLIANCE_SHOPIFY_CLIENT_SECRET_FILE: /secrets_app/shopify-client-secret
    volumes:
      - ../../../database:/app:ro       # compliance_api コード(scp 直送で更新)
      - C:/Users/smiki/secrets/compliance:/secrets:ro
      - C:/Users/smiki/secrets/marketing/shopify-client-id:/secrets_app/shopify-client-id:ro
      - C:/Users/smiki/secrets/marketing/shopify-client-secret:/secrets_app/shopify-client-secret:ro
      # JAN 外部取得の実装は CMS 側にしか無い。コピーを作らず 1 ファイルだけ ro マウント。
      - ../../shared/jan_lookup.py:/opt/cms_shared/jan_lookup.py:ro
    networks:
      - cms_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

networks:
  cms_net:
    driver: bridge
  # ============================================================
  # 跨 stack 共享网络（与 deploy/n8n/docker-compose.yml 同名 external）
  # 部署前需先手动建一次:  docker network create smikie_shared
  # 然后两边 stack 都 docker compose up -d --force-recreate
  # 仅 postgres 服务加入此网络（让 N8N stack 的 cms-api 能直连）
  # ============================================================
  smikie_shared:
    external: true
    name: smikie_shared
