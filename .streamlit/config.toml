# [theme] 段已移除 → 完全默认 Streamlit 主题（Boss 2026-05-25：全部还原到最原始）。
# 默认 = 白底 + 默认红强调色 + Source Sans + 16px。

[server]
maxUploadSize = 200
# WS ping/timeout 30s→60s（2026-08-30）: 41MB 請求書アップロード中に上りが
# 飽和すると pong が 30s に間に合わず、サーバが WS を切断 → 前端が再接続 =
# 「強制リフレッシュ」でファイルが消える。60s なら CF の idle 100s 制限内で
# 最大の余裕。サーバ側実測は正常（同一ファイル 41.7MB を協議シミュレーションで
# 2 回 204 成功）なので、断因はクライアント側の保活と推定。
websocketPingInterval = 60
# 断線後のセッション保持 120s→900s（Boss 2026-11-11「保留到15分钟就可以」）: page15 で入力後に
# 「アップロード待ち」へ戻る＝120s 超の断線で新セッション化し、ファイル・結果・編集が消えていた。
disconnectedSessionTTL = 900
enableCORS = false
enableXsrfProtection = true
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = false
